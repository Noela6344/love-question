<!DOCTYPE html>
<html>
<head>
    <title>Important Question ❤️</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            text-align:center;
            background:#ffe6f2;
            padding-top:100px;
        }
        button{
            padding:15px 30px;
            font-size:18px;
            margin:10px;
            border:none;
            border-radius:10px;
            cursor:pointer;
        }
        .yes{background:#4CAF50;color:white;}
        .no{background:#ff4d4d;color:white;}
    </style>
</head>
<body>

<div id="question1">
    <h1>❤️ Do you love me? ❤️</h1>
    <button class="yes" onclick="showQuestion2()">Yes 😍</button>
    <button class="no" onclick="showNo()">No 😢</button>
</div>

<div id="question2" style="display:none;">
    <h1>🥰 Yayyy! 🥰</h1>
    <h2>When are we kissing? 😘</h2>
    <button onclick="answer('Soon 😘')">Soon 😘</button>
    <button onclick="answer('Very Soon 💋')">Very Soon 💋</button>
    <button onclick="answer('ASAP ❤️')">ASAP ❤️</button>
</div>

<div id="result"></div>

<script>
function showQuestion2(){
    document.getElementById("question1").style.display="none";
    document.getElementById("question2").style.display="block";
}

function showNo(){
    document.getElementById("result").innerHTML =
    "<h1>😢 Ouch! My heart!</h1>";
}

function answer(text){
    document.getElementById("question2").style.display="none";
    document.getElementById("result").innerHTML =
    "<h1>😍 " + text + " 😍</h1>";
}
</script>

</body>
</html>
